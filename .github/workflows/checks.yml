name: Demo checks

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  demo-checks:
    name: Build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static demo
        run: npm run build
      - name: Browser checks against built demo
        # Match the locked Playwright version; the image supplies browser system libraries.
        run: docker run --rm --ipc=host -e CI=1 -v "$GITHUB_WORKSPACE:/work" -v /tmp:/tmp -w /work mcr.microsoft.com/playwright:v1.63.0-noble npm test
      - name: Upload browser reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            /tmp/usr-member-demo-tests
            /tmp/usr-member-demo-report
            /tmp/usr-member-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload checked Pages artifact
        if: ${{ inputs.upload-pages }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  verify:
    name: verify
    if: ${{ always() }}
    needs: [demo-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every correctness job to succeed
        env:
          CHECK_RESULT: ${{ needs.demo-checks.result }}
        run: test "$CHECK_RESULT" = success
